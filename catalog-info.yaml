apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: api-cep
  description: API simples em FastAPI para consultar CEP via ViaCEP
  tags:
    - api
    - rest
    - python
    - fastapi
    - docker
    - backend
    - experimental
  annotations:
    github.com/project-slug: andreibr/api-cep
  links:
    - url: https://github.com/andreibr/api-cep
      title: Repositório (GitHub)
      icon: github
    - url: http://localhost:3000/api-docs
      title: API Docs (Backstage)
      icon: docs
    - url: http://localhost:8000/docs
      title: Swagger UI (FastAPI)
      icon: docs
    - url: http://viacep.com.br
      title: ViaCEP (External Service)
      icon: web
      type: external-dependenty
spec:
  type: service
  lifecycle: experimental
  owner: group:default/cep-api
  providesApis:
    - api-cep
  dependsOn:
    - resource:default/viacep-api
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: viacep-api
  description: External API to Brazilian CEP Consults
  tags:
    - external
    - api
    - third-party
  links:
    - url: https://viacep.com.br
      title: ViaCEP Website
      icon: web
    - url: https://viacep.com.br/ws/01001000/json/
      title: Query Sample
      icon: docs
spec:
  type: external-api
  owner: group:default/cep-api
  dependencyOf:
    - component:default/api-cep
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: api-cep
  description: External API to Brazilian CEP Consults
  annotations:
    github.com/project-slug: andreibr/api-cep
    backstage.io/techdocs-ref: dir:.
  tags:
    - rest
    - openapi
    - cep
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/cep-api
  system: api-cep
  definition:
    $text: ./openapi.yaml

